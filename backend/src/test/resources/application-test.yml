spring:
  # JPA - validate schema in tests too
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway runs migrations on the testcontainers DB
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Mail disabled in tests
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # Data source will be overridden by Testcontainers @DynamicPropertySource
  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test

  # Redis will be set by @DynamicPropertySource from Testcontainers

# App config for tests
app:
  base-url: http://localhost:8080
  api-prefix: /api
  cors:
    allowed-origins:
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  jwt:
    secret: test-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-for-hs256
    access-token-ttl: 900
    refresh-token-ttl: 604800
    refresh-token-prefix: "colearning:refresh:"
  storage:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket-avatars: colearning-test
    bucket-pets: colearning-test
  rate-limit:
    login:
      max-attempts: 5
      window-seconds: 300
    email:
      max-attempts: 5
      window-seconds: 60

logging:
  level:
    com.colearning: DEBUG
    org.springframework.security: DEBUG
