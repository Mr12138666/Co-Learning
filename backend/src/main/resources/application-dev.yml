# ===== Development Profile =====
# Uses Docker Compose services: PostgreSQL, Redis, MinIO, MailHog

spring:
  # ===== DataSource =====
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:colearning}
    username: ${POSTGRES_USER:colearning}
    password: ${POSTGRES_PASSWORD:colearning_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

  # ===== JPA (dev: show SQL) =====
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false

# Dev: more verbose logging
logging:
  level:
    com.colearning: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
