# ===== Production Profile =====
# All secrets come from environment variables.

spring:
  # ===== DataSource =====
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:colearning}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0

  # ===== JPA (prod: no SQL logging) =====
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ===== Mail (use real SMTP in production) =====
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Prod: minimal logging
logging:
  level:
    com.colearning: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
