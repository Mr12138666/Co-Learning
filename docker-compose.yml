# Co-Learning 伴学平台 - 开发环境 Docker Compose
# 启动: docker compose up -d
# 停止: docker compose down
# 清除数据: docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: colearning-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-colearning}
      POSTGRES_USER: ${POSTGRES_USER:-colearning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-colearning_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-colearning}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: colearning-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: colearning-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: colearning-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minio} ${MINIO_SECRET_KEY:-minio123} &&
      mc mb local/avatars --ignore-existing &&
      mc mb local/pets --ignore-existing &&
      mc mb local/images --ignore-existing &&
      mc anonymous set download local/avatars &&
      mc anonymous set download local/pets &&
      mc anonymous set download local/images &&
      mc cors set --origin 'http://localhost:5173' --origin 'http://localhost:8080' --method 'GET' --header 'Content-Type' local/avatars &&
      mc cors set --origin 'http://localhost:5173' --origin 'http://localhost:8080' --method 'GET' --header 'Content-Type' local/pets &&
      mc cors set --origin 'http://localhost:5173' --origin 'http://localhost:8080' --method 'GET' --header 'Content-Type' local/images &&
      echo 'MinIO buckets initialized successfully'
      "
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: colearning-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
